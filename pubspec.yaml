name: task_nest
description: "TaskNest: a simple offline habit tracker"

publish_to: "none"
version: 2.4.1+51

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.5
  dartz: ^0.10.1
  isar_community: ^3.3.0
  isar_community_flutter_libs: ^3.3.0
  shared_preferences: ^2.5.1
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^4.1.0
  timezone: ^0.10.0
  package_info_plus: ^8.2.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  permission_handler: ^11.4.0
  flutter_localizations:
    sdk: flutter
  intl: any
  vibration: ^3.1.3
  flutter_ringtone_player: ^4.0.0+4
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  isar_community_generator: ^3.3.0

flutter_native_splash:
  image: assets/app/icon.png
  color: "#151515"
  #background_image:

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/app/icon.png"

flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/app/
  #   - images/a_dot_ham.jpeg

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Digital
      fonts:
        - asset: assets/fonts/Digital-7-Mono.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
