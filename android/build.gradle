allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.layout.buildDirectory.set(file("../build"))
subprojects {
    project.layout.buildDirectory.set(rootProject.layout.buildDirectory.dir(project.name))
}

// AGP 9 checks that every Android module compiles against a compileSdk that
// satisfies its dependencies. Some plugins still declare an outdated
// compileSdk, so align them with the app module.
// This must be registered before :app is evaluated by the block below.
subprojects {
    afterEvaluate { project ->
        def androidExtension = project.extensions.findByName("android")
        if (androidExtension != null) {
            def appCompileSdk = project.rootProject.project(":app").android.compileSdk
            if (androidExtension.compileSdk < appCompileSdk) {
                androidExtension.compileSdk = appCompileSdk
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory.get().asFile
}
